services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: pulsewire
      MYSQL_USER: pulsewire
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DEMO_MODE: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pulsewire
      DB_USERNAME: pulsewire
      DB_PASSWORD: secret
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    volumes:
      - .:/var/www/html

  reverb:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      DEMO_MODE: "true"
      DB_HOST: mysql
      DB_DATABASE: pulsewire
      DB_USERNAME: pulsewire
      DB_PASSWORD: secret
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - .:/var/www/html

  queue:
    build: .
    environment:
      APP_ENV: local
      DEMO_MODE: "true"
      DB_HOST: mysql
      DB_DATABASE: pulsewire
      DB_USERNAME: pulsewire
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3"]
    volumes:
      - .:/var/www/html

volumes:
  mysql_data:
